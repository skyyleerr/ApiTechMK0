<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#FFC72C"><title>ApiTech - Verificar empresa</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" th:href="@{/css/login.css}"></head><body><div class="container"><div class="logo"><img th:src="@{/img/apitech_logo.png}" alt="ApiTech Logo"><h2>ApiTech</h2></div><div th:if="${errorMsg}" class="alert alert-danger"><i class="fa-solid fa-circle-exclamation"></i><span th:text="${errorMsg}">Empresa no encontrada</span></div><div id="verificar-nit" class="slide"><div class="title">Verifica tu empresa</div><p style="text-align:center;margin-bottom:20px;color:#666">Ingresa el NIT de tu empresa apicultora para continuar.</p><form th:action="@{/login/empresa}" method="POST" novalidate><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="input-group"><input type="text" name="nit" placeholder="NIT de la empresa (Ej: 900123456-7)" required autofocus><i class="fa-solid fa-building"></i></div><button type="submit" class="btn"><i class="fa-solid fa-arrow-right"></i> Continuar</button></form></div></div></body></html>
