<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="ApiTech - Acceso a la plataforma de monitoreo de colmenas"><meta name="theme-color" content="#FFC72C"><title>ApiTech - Acceso</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" th:href="@{/css/login.css}"></head><body><div class="container"><div class="logo"><img th:src="@{/img/apitech_logo.png}" alt="ApiTech Logo"><h2>ApiTech</h2></div><p style="text-align:center;margin-bottom:10px;color:#666;font-size:14px"><span th:if="${empresaNombre}" th:text="${empresaNombre}"></span><span th:if="${empresaNombre}">&nbsp;·&nbsp;</span><a th:href="@{/login/empresa}" style="color:#FFC72C">Cambiar de empresa</a></p><div th:if="${errorMsg}" class="alert alert-danger" id="alert"><i class="fa-solid fa-circle-exclamation"></i><span th:text="${errorMsg}">Correo o contraseña incorrectos</span></div><div th:if="${logoutMsg}" class="alert alert-success" id="alert"><i class="fa-solid fa-circle-check"></i><span th:text="${logoutMsg}">Sesión cerrada correctamente.</span></div><div id="login" class="slide"><div class="title">Iniciar Sesión</div><form th:action="@{/login}" method="POST" novalidate><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="input-group"><input type="email" name="correo" placeholder="Correo electrónico" required autocomplete="email" autofocus><i class="fa-solid fa-envelope"></i></div><div class="input-group"><input type="password" name="password" placeholder="Contraseña" required autocomplete="current-password"><i class="fa-solid fa-lock"></i></div><button type="submit" class="btn" name="login"><i class="fa-solid fa-sign-in-alt"></i> Ingresar</button></form></div></div></body></html>
