<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout/base :: head(${titulo})}"></head><body><div th:replace="~{layout/base :: sidebar}"></div><div class="main"><div th:replace="~{layout/base :: topbar}"></div><div class="header"><h1><i class="fa-solid" th:classappend="${titulo.contains('Editar') ? ' fa-pencil' : ' fa-plus'}" style="color:#FFC72C"></i> <span th:text="${titulo}">Nueva colmena</span></h1></div><style>body{background:linear-gradient(135deg,#f5f7fa,#c3cfe2)}.form-container{max-width:600px;margin:35px auto;background:#fff;padding:40px;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.15)}.form-header{text-align:center;margin-bottom:32px}.form-header h1{margin:0 0 12px;font-size:28px}.form-group{margin-bottom:24px}.form-group label{display:block;margin-bottom:8px;font-weight:600;color:#333;font-size:14px}.form-group input,.form-group select{width:100%;padding:12px 14px;border:2px solid #e5e7eb;border-radius:8px;font-size:14px;box-sizing:border-box}.form-group input:focus,.form-group select:focus{outline:none;border-color:#FFC72C;box-shadow:0 0 0 4px rgba(255,199,44,.1)}.form-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:32px}.btn-submit,.btn-volver{padding:12px 24px;border:0;border-radius:8px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none}.btn-submit{background:linear-gradient(135deg,#FFC72C,#ffb700);color:#1a1a1a}.btn-volver{background:#e5e7eb;color:#374151}</style><div class="form-container"><div class="form-header"><h1 th:text="${titulo}">Nueva Colmena</h1><p style="color:#666;font-size:14px">Completa la información de tu colmena</p></div><form method="post" th:action="${accion}" th:object="${colmena}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" th:field="*{idEmpresa}"><div class="form-group"><label for="nombre">Nombre de la colmena *</label><input id="nombre" th:field="*{nombre}" placeholder="Ej: Colmena Norte" required><small th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" style="color:#b91c1c"></small></div><div class="form-group"><label for="ubicacion">Ubicación</label><input id="ubicacion" th:field="*{ubicacion}" placeholder="Ej: Sector La Montaña"></div><div class="form-group"><label for="estado">Estado *</label><select id="estado" th:field="*{estado}" required><option value="Estable">Estable</option><option value="Advertencia">Advertencia</option><option value="Crítico">Crítico</option></select></div><div class="form-actions"><button type="submit" class="btn-submit"><i class="fa-solid fa-save"></i> Guardar Colmena</button><a class="btn-volver" th:href="@{/app/colmenas}"><i class="fa-solid fa-arrow-left"></i> Volver</a></div></form></div></div></body></html>
