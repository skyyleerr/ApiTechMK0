<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout/base :: head('Colmenas')}"></head><body><div th:replace="~{layout/base :: sidebar}"></div><div class="main"><div th:replace="~{layout/base :: topbar}"></div><div class="header"><h1>📦 Gestión de Colmenas</h1><a th:href="@{/app/colmenas/nueva}"><button class="btn"><i class="fa-solid fa-plus"></i> Nueva Colmena</button></a></div><style>.alert{padding:14px 16px;border-radius:8px;margin:20px 25px 0;display:flex;gap:12px}.alert-success{background:#ecfdf5;color:#065f46;border:1px solid #6ee7b7}.alert-error{background:#fff1f2;color:#991b1b;border:1px solid #fca5a5}.btn-icon{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;border:0;cursor:pointer;text-decoration:none}.btn-icon-edit{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff}.btn-icon-delete{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}.actions-cell{display:flex;gap:8px}</style><div th:if="${param.creada}" class="alert alert-success"><i class="fa-solid fa-check-circle"></i> Colmena creada correctamente.</div><div th:if="${param.actualizada}" class="alert alert-success"><i class="fa-solid fa-check-circle"></i> Colmena actualizada correctamente.</div><div th:if="${param.eliminada}" class="alert alert-success"><i class="fa-solid fa-check-circle"></i> Colmena eliminada correctamente.</div><div class="dashboard"><div class="table-container"><h3 style="margin:0 16px 16px;padding-top:16px;font-size:18px;font-weight:700">Colmenas Registradas</h3><table id="tabla-colmenas"><thead><tr><th>ID</th><th>Nombre</th><th>Ubicación</th><th>Estado</th><th>Fecha Registro</th><th>Acciones</th></tr></thead><tbody><tr th:each="c:${colmenas}"><td th:text="|#${c.idColmena}|">#1</td><td><strong th:text="${c.nombre}">Colmena</strong></td><td th:text="${c.ubicacion}">Ubicación</td><td><span th:class="${c.estado == 'Estable' ? 'ok' : (c.estado == 'Advertencia' ? 'warn' : 'bad')}" th:text="${c.estado}">Estable</span></td><td th:text="${#temporals.format(c.fechaCreacion,'dd/MM/yyyy')}">09/09/2026</td><td><div class="actions-cell"><a class="btn-icon btn-icon-edit" th:href="@{/app/colmenas/{id}/editar(id=${c.idColmena})}" title="Editar"><i class="fa-solid fa-pen"></i></a><form method="post" th:action="@{/app/colmenas/{id}/eliminar(id=${c.idColmena})}" onsubmit="return confirm('¿Eliminar esta colmena?')"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn-icon btn-icon-delete" title="Eliminar"><i class="fa-solid fa-trash"></i></button></form></div></td></tr><tr th:if="${#lists.isEmpty(colmenas)}"><td colspan="6" style="text-align:center;padding:40px;color:#999"><i class="fa-solid fa-inbox" style="font-size:32px;display:block;margin-bottom:10px"></i>No hay colmenas registradas</td></tr></tbody></table></div></div></div></body></html>
