<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout/base :: head('Verificar pagos')}"></head><body><div th:replace="~{layout/base :: sidebar}"></div><main class="main"><div th:replace="~{layout/base :: topbar}"></div><div class="header"><h1>Pasarela de pagos · Verificación</h1></div><section class="dashboard"><div class="cards"><div class="card"><div class="card-icon"><i class="fa-solid fa-money-bill-transfer"></i></div><div class="card-title">Pagos pendientes</div><div class="card-value" th:text="${#lists.size(pagos)}">0</div></div><div class="card"><div class="card-icon"><i class="fa-solid fa-chart-line"></i></div><div class="card-title">Total recibido</div><div class="card-value" th:text="${'$ ' + totalPagos}">$0</div></div></div><div class="table-container"><h3>Solicitudes por verificar</h3><table><thead><tr><th>ID</th><th>Empresa</th><th>Plan</th><th>Valor</th><th>Referencia</th><th>Acciones</th></tr></thead><tbody><tr th:each="p:${pagos}"><td th:text="${p.idPago}">1</td><td th:text="${p.empresa.nombreEmpresa}">Empresa</td><td th:text="${p.suscripcion.plan.nombrePlan}">Plan</td><td th:text="${'$ ' + p.valor}">$0</td><td th:text="${p.referencia}">—</td><td><form style="display:inline" method="post" th:action="@{/admin/pagos/{id}/verificar(id=${p.idPago})}"><input type="hidden" name="_csrf" th:value="${_csrf.token}"><button class="btn" type="submit"><i class="fa-solid fa-check"></i> Verificar</button></form><form style="display:inline" method="post" th:action="@{/admin/pagos/{id}/rechazar(id=${p.idPago})}"><input type="hidden" name="_csrf" th:value="${_csrf.token}"><button class="btn" style="background:#fee2e2;margin-left:5px" type="submit">Rechazar</button></form></td></tr><tr th:if="${#lists.isEmpty(pagos)}"><td colspan="6" style="text-align:center;padding:30px">No hay pagos pendientes.</td></tr></tbody></table></div></section></main></body></html>
