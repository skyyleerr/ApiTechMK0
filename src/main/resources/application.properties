# ─────────────────────────────────────────────────────────────
# ApiTech MK5 — application.properties
# ─────────────────────────────────────────────────────────────

spring.application.name=apitech-mk5

# H2 por defecto para una demo funcional; use DB_URL/DB_USER/DB_PASSWORD para MySQL.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/apitech;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Thymeleaf ────────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ── Servidor ─────────────────────────────────────────────────
server.port=${PORT:8080}
server.error.include-message=always
server.servlet.context-path=${CONTEXT_PATH:}
